    <polyline points="1100,578 1100,632 731,632" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="720,593 720,623" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="242,469 242,632 709,632" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="1268,469 1268,632 1100,632" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" />
    <polyline points="720,641 720,659" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
    <circle cx="720" cy="191" r="7" fill="#202832" />
    <polygon points="560,270 720,216 880,270 720,324" stroke="#202832" stroke-width="2.5" fill="#D9C9ED" stroke-linejoin="round" />
    <text x="720" y="277" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="#202832">프레임 n은 어느 구간인가?</text>
    <g>
      <rect x="74" y="381" width="337" height="88" rx="12" fill="#D9C9ED" stroke="#202832" stroke-width="2.5" />
      <text x="242.5" y="418.0" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">타이틀 카드</text>
      <text x="242.5" y="447.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">card_frame(credits=False)</text>
    </g>
    <g>
      <rect x="500" y="373" width="440" height="102" rx="12" fill="#D9C9ED" stroke="#202832" stroke-width="2.5" />
      <text x="720.0" y="403.0" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">본편 장면</text>
      <text x="720.0" y="432.0" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">장면이 바뀌면 prev 초기화</text>
      <text x="720.0" y="461.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">letters() → pixels()</text>
    </g>
    <g>
      <rect x="1035" y="381" width="329" height="88" rx="12" fill="#D9C9ED" stroke="#202832" stroke-width="2.5" />
      <text x="1199.5" y="418.0" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">크레딧 카드</text>
      <text x="1199.5" y="447.0" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">card_frame(credits=True)</text>
    </g>
    <polygon points="571,547 720,501 869,547 720,593" stroke="#202832" stroke-width="2.5" fill="#D9C9ED" stroke-linejoin="round" />
    <text x="720" y="554" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="650" text-anchor="middle" fill="#202832">n ≥ 1700?</text>
    <g>
      <rect x="959" y="517" width="282" height="61" rx="12" fill="#D9C9ED" stroke="#202832" stroke-width="2.5" />
      <text x="1100.0" y="554.5" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">end_caption()</text>
    </g>
    <polygon points="708,632 720,623 732,632 720,641" fill="#D9C9ED" stroke="#202832" stroke-width="2" />
    <g>
      <rect x="561" y="659" width="318" height="52" rx="12" fill="#DDE6AD" stroke="#202832" stroke-width="2.5" />
      <text x="720.0" y="692.0" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">ASCII 프레임 반환</text>
