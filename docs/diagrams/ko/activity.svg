<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">프레임 번호에 따라 장면을 그리는 법</title>
  <desc id="desc">episode_frames()는 한국어판 11화의 각 장면을 프레임 번호 n에 맞춰 그린다. 번호는 0부터 센다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M0,0 L10,5 L0,10 z" fill="#202832" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M1,0 L10,5 L1,10" fill="none" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <g id="page">
    <rect x="0" y="0" width="1440" height="810" rx="0" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="48" y="46" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#202832">하치와레 ASCII</text>
    <text x="1392" y="46" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="19" font-weight="650" text-anchor="end" fill="#455362">활동 다이어그램</text>
    <text x="46" y="105" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="42" font-weight="740" text-anchor="start" fill="#202832">프레임 번호에 따라 장면을 그리는 법</text>
    <text x="48" y="147" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="21" font-weight="450" text-anchor="start" fill="#455362">episode_frames()는 한국어판 11화의 각 장면을 프레임 번호 n에 맞춰 그린다. 번호는 0부터 센다.</text>
    <line x1="48" y1="171" x2="1392" y2="171" stroke="#8D9895" stroke-width="1.7" />
    <line x1="48" y1="739" x2="1392" y2="739" stroke="#202832" stroke-width="1.9" />
    <rect x="48" y="761" width="25" height="20" rx="4" fill="#BCE2D1" stroke="#202832" stroke-width="1.9" />
    <text x="86" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">입력·원본 음원</text>
    <rect x="389" y="761" width="25" height="20" rx="4" fill="#D9C9ED" stroke="#202832" stroke-width="1.9" />
    <text x="427" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">ASCII 변환</text>
    <rect x="730" y="761" width="25" height="20" rx="4" fill="#EDCADC" stroke="#202832" stroke-width="1.9" />
    <text x="768" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">코드 표시</text>
    <rect x="1071" y="761" width="25" height="20" rx="4" fill="#DDE6AD" stroke="#202832" stroke-width="1.9" />
    <text x="1109" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">합성·출력</text>
  </g>
