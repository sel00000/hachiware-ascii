<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">코드가 움직일 때와 멈출 때</title>
  <desc id="desc">Editor.frame()은 큐나 화면 키가 바뀌면 패널을 다시 그린다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M0,0 L10,5 L0,10 z" fill="#202832" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M1,0 L10,5 L1,10" fill="none" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <g id="page">
    <rect x="0" y="0" width="1440" height="810" rx="0" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="48" y="46" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#202832">하치와레 ASCII</text>
    <text x="1392" y="46" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="19" font-weight="650" text-anchor="end" fill="#455362">상태 전이도</text>
    <text x="46" y="105" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="42" font-weight="740" text-anchor="start" fill="#202832">코드가 움직일 때와 멈출 때</text>
    <text x="48" y="147" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="21" font-weight="450" text-anchor="start" fill="#455362">Editor.frame()은 큐나 화면 키가 바뀌면 패널을 다시 그린다.</text>
    <line x1="48" y1="171" x2="1392" y2="171" stroke="#8D9895" stroke-width="1.7" />
    <line x1="48" y1="739" x2="1392" y2="739" stroke="#202832" stroke-width="1.9" />
    <rect x="48" y="761" width="25" height="20" rx="4" fill="#BCE2D1" stroke="#202832" stroke-width="1.9" />
    <text x="86" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">입력·원본 음원</text>
    <rect x="389" y="761" width="25" height="20" rx="4" fill="#D9C9ED" stroke="#202832" stroke-width="1.9" />
    <text x="427" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">ASCII 변환</text>
    <rect x="730" y="761" width="25" height="20" rx="4" fill="#EDCADC" stroke="#202832" stroke-width="1.9" />
    <text x="768" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">코드 표시</text>
    <rect x="1071" y="761" width="25" height="20" rx="4" fill="#DDE6AD" stroke="#202832" stroke-width="1.9" />
    <text x="1109" y="778" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">합성·출력</text>
  </g>
  <g id="groups">
    <rect x="120" y="556" width="1210" height="145" rx="18" fill="#F9E8F0" stroke="#202832" stroke-width="2.5" />
    <text x="139" y="592" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#853F65">오른쪽 패널의 캐시 키</text>
  </g>
  <g id="connections">
    <polyline points="76,360 120,360" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="433,360 571,360" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="881,360 1025,360" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="1177,423 1177,475 724,475 724,423" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="1177,300 1177,234 277,234 277,300" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="725,300 725,234" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" />
    <polyline points="590,423 590,504 534,504 534,403 571,403" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
    <g>
      <rect x="120" y="300" width="313" height="123" rx="12" fill="#EDCADC" stroke="#202832" stroke-width="2.5" />
      <text x="276.5" y="340.5" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">새 큐 선택</text>
      <text x="276.5" y="369.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">set_cue(index)</text>
      <text x="276.5" y="398.5" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">코드 발췌본 생성 · 캐시 초기화</text>
    </g>
    <g>
      <rect x="571" y="300" width="310" height="123" rx="12" fill="#EDCADC" stroke="#202832" stroke-width="2.5" />
      <text x="726.0" y="340.5" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">스크롤 · 강조</text>
      <text x="726.0" y="369.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">window(step, elapsed)</text>
      <text x="726.0" y="398.5" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">새로 그린 화면을 패널에 붙이기</text>
    </g>
    <g>
      <rect x="1025" y="300" width="306" height="123" rx="12" fill="#EDCADC" stroke="#202832" stroke-width="2.5" />
      <text x="1178.0" y="340.5" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">화면 유지</text>
      <text x="1178.0" y="369.5" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">키가 같으면 패널 재사용</text>
      <text x="1178.0" y="398.5" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">다음 프레임 번호를 기다림</text>
    </g>
    <circle cx="65" cy="360" r="10" fill="#202832" />
    <text x="142" y="636" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="650" text-anchor="start" fill="#202832">(step, min(12, elapsed))</text>
    <text x="142" y="673" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#455362">12프레임은 0.4초다. 같은 화면을 재사용할 때도 프레임마다 인코더에 바이트를 보낸다.</text>
  </g>
  <g id="labels">
    <rect x="469.5" y="331" width="67" height="24" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="503" y="347" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#455362">첫 화면</text>
    <rect x="919.5" y="330" width="67" height="24" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="953" y="346" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#455362">같은 키</text>
    <rect x="833.0" y="447" width="230" height="25" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="948" y="464" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#455362">같은 큐 안에서 다음 줄로 이동</text>
    <rect x="813.0" y="205" width="174" height="25" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="900" y="222" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#455362">다음 큐의 시작 프레임</text>
    <rect x="469.0" y="512" width="160" height="23" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="549" y="527" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#455362">스크롤 보간 중 키 갱신</text>
  </g>
</svg>