    <text x="48" y="147" font-family="Noto Sans KR, Noto Sans CJK KR, Malgun Gothic, sans-serif" font-size="21" font-weight="450" text-anchor="start" fill="#455362">메모리에서는 파일명과 줄 번호로 소스 한 줄을, 시작 프레임으로 큐를 찾는다.</text>
