<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="ko">
  <title id="title">장면과 실제 소스 줄의 관계</title>
  <desc id="desc">메모리에서는 파일명과 줄 번호로 소스 한 줄을, 시작 프레임으로 큐를 찾는다.</desc>
