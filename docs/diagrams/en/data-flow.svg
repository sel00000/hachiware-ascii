<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">From one frame to QHD</title>
  <desc id="desc">Image pixels, Python text and the original soundtrack take separate paths into the same MP4.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M0,0 L10,5 L0,10 z" fill="#202832" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M1,0 L10,5 L1,10" fill="none" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <g id="page">
    <rect x="0" y="0" width="1440" height="810" rx="0" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="48" y="46" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#202832">HACHIWARE ASCII</text>
    <text x="1392" y="46" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650" text-anchor="end" fill="#455362">Data-flow diagram</text>
    <text x="46" y="105" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="740" text-anchor="start" fill="#202832">From one frame to QHD</text>
    <text x="48" y="147" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="450" text-anchor="start" fill="#455362">Image pixels, Python text and the original soundtrack take separate paths into the same MP4.</text>
    <line x1="48" y1="171" x2="1392" y2="171" stroke="#8D9895" stroke-width="1.7" />
    <line x1="48" y1="739" x2="1392" y2="739" stroke="#202832" stroke-width="1.9" />
    <rect x="48" y="761" width="25" height="20" rx="4" fill="#BCE2D1" stroke="#202832" stroke-width="1.9" />
    <text x="86" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">Input and audio</text>
    <rect x="389" y="761" width="25" height="20" rx="4" fill="#D9C9ED" stroke="#202832" stroke-width="1.9" />
    <text x="427" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">ASCII conversion</text>
    <rect x="730" y="761" width="25" height="20" rx="4" fill="#EDCADC" stroke="#202832" stroke-width="1.9" />
    <text x="768" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">Code display</text>
    <rect x="1071" y="761" width="25" height="20" rx="4" fill="#DDE6AD" stroke="#202832" stroke-width="1.9" />
    <text x="1109" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">Composition and output</text>
  </g>
  <g id="groups">
    <rect x="48" y="210" width="310" height="481" rx="18" fill="#E0F2E9" stroke="#202832" stroke-width="2.5" />
    <text x="67" y="246" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#205C4C">Input tracks</text>
    <rect x="390" y="210" width="313" height="229" rx="18" fill="#EEE8F8" stroke="#202832" stroke-width="2.5" />
    <text x="409" y="246" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#634181">Cell classification</text>
    <rect x="735" y="210" width="313" height="229" rx="18" fill="#EEE8F8" stroke="#202832" stroke-width="2.5" />
    <text x="754" y="246" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#634181">Glyph rendering</text>
    <rect x="390" y="478" width="658" height="148" rx="18" fill="#F9E8F0" stroke="#202832" stroke-width="2.5" />
    <text x="409" y="514" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#853F65">Code panel</text>
    <rect x="1080" y="210" width="312" height="481" rx="18" fill="#F0F2D8" stroke="#202832" stroke-width="2.5" />
    <text x="1099" y="246" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#505F26">MP4 assembly</text>
  </g>
  <g id="connections">
    <polyline points="341,351 407,351" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="685,351 752,351" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="1030,351 1097,351" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="1022,569 1097,569" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="341,650 1097,650" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
    <g>
      <rect x="65" y="293" width="276" height="117" rx="12" fill="#FFFFFF" stroke="#202832" stroke-width="2.5" />
      <text x="81" y="330.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="start" fill="#202832">RGB frame</text>
      <text x="81" y="359.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">frames() · rgb24</text>
      <text x="81" y="388.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">One RGB array per frame</text>
    </g>
    <g>
      <rect x="407" y="293" width="278" height="117" rx="12" fill="#FFFFFF" stroke="#202832" stroke-width="2.5" />
      <text x="423" y="330.5" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="690" text-anchor="start" fill="#202832">letters()</text>
      <text x="423" y="359.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">3 × 3 samples → one cell</text>
      <text x="423" y="388.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">Glyph index and cell color</text>
    </g>
    <g>
      <rect x="752" y="293" width="278" height="117" rx="12" fill="#FFFFFF" stroke="#202832" stroke-width="2.5" />
      <text x="768" y="330.5" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="690" text-anchor="start" fill="#202832">pixels()</text>
      <text x="768" y="359.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">Glyph mask × cell RGB</text>
      <text x="768" y="388.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">Picture in the ASCII master</text>
    </g>
    <g>
      <rect x="1097" y="293" width="278" height="117" rx="12" fill="#FFFFFF" stroke="#202832" stroke-width="2.5" />
      <text x="1113" y="330.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="start" fill="#202832">Left picture</text>
      <text x="1113" y="359.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">Crop → scale → pad</text>
      <text x="1113" y="388.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">1376 × 1440</text>
    </g>
    <g>
      <rect x="412" y="535" width="610" height="69" rx="12" fill="#FFFFFF" stroke="#202832" stroke-width="2.5" />
      <text x="717.0" y="576.5" font-family="DejaVu Sans Mono, monospace" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">Source → Excerpt.window() → Editor.frame()</text>
    </g>
    <g>
      <rect x="1097" y="525" width="278" height="87" rx="12" fill="#FFFFFF" stroke="#202832" stroke-width="2.5" />
      <text x="1113" y="561.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="start" fill="#202832">Right-side code</text>
      <text x="1113" y="590.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="start" fill="#455362">RGB24 → YUV 4:2:0</text>
    </g>
    <g>
      <rect x="65" y="626" width="276" height="47" rx="12" fill="#BCE2D1" stroke="#202832" stroke-width="2.5" />
      <text x="203.0" y="656.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">Original stereo AAC</text>
    </g>
    <g>
      <rect x="1097" y="626" width="278" height="47" rx="12" fill="#DDE6AD" stroke="#202832" stroke-width="2.5" />
      <text x="1236.0" y="656.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">AAC stream copy</text>
    </g>
  </g>
  <g id="labels">
    <text x="718" y="644" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#455362">Keep the original AAC timestamps</text>
  </g>
</svg>