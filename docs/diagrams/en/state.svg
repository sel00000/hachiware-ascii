<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 1440 810" role="img" aria-labelledby="title desc" lang="en">
  <title id="title">When the code moves and when it holds</title>
  <desc id="desc">Editor.frame() compares the cue and view key to decide when to redraw the panel.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M0,0 L10,5 L0,10 z" fill="#202832" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
    <marker id="open" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse" viewBox="-1 -1 13 12">
      <path d="M1,0 L10,5 L1,10" fill="none" stroke="#202832" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>
  <g id="page">
    <rect x="0" y="0" width="1440" height="810" rx="0" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="48" y="46" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#202832">HACHIWARE ASCII</text>
    <text x="1392" y="46" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="650" text-anchor="end" fill="#455362">State diagram</text>
    <text x="46" y="105" font-family="DejaVu Sans, sans-serif" font-size="42" font-weight="740" text-anchor="start" fill="#202832">When the code moves and when it holds</text>
    <text x="48" y="147" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="450" text-anchor="start" fill="#455362">Editor.frame() compares the cue and view key to decide when to redraw the panel.</text>
    <line x1="48" y1="171" x2="1392" y2="171" stroke="#8D9895" stroke-width="1.7" />
    <line x1="48" y1="739" x2="1392" y2="739" stroke="#202832" stroke-width="1.9" />
    <rect x="48" y="761" width="25" height="20" rx="4" fill="#BCE2D1" stroke="#202832" stroke-width="1.9" />
    <text x="86" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">Input and audio</text>
    <rect x="389" y="761" width="25" height="20" rx="4" fill="#D9C9ED" stroke="#202832" stroke-width="1.9" />
    <text x="427" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">ASCII conversion</text>
    <rect x="730" y="761" width="25" height="20" rx="4" fill="#EDCADC" stroke="#202832" stroke-width="1.9" />
    <text x="768" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">Code display</text>
    <rect x="1071" y="761" width="25" height="20" rx="4" fill="#DDE6AD" stroke="#202832" stroke-width="1.9" />
    <text x="1109" y="778" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="550" text-anchor="start" fill="#202832">Composition and output</text>
  </g>
  <g id="groups">
    <rect x="120" y="556" width="1210" height="145" rx="18" fill="#F9E8F0" stroke="#202832" stroke-width="2.5" />
    <text x="139" y="592" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700" text-anchor="start" fill="#853F65">Cache key for the right-hand panel</text>
  </g>
  <g id="connections">
    <polyline points="76,360 120,360" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="433,360 571,360" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="881,360 1025,360" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="1177,423 1177,475 724,475 724,423" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="1177,300 1177,234 277,234 277,300" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
    <polyline points="725,300 725,234" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" />
    <polyline points="590,423 590,504 534,504 534,403 571,403" fill="none" stroke="#202832" stroke-width="2.35" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arrow)" />
  </g>
  <g id="nodes">
    <g>
      <rect x="120" y="300" width="313" height="123" rx="12" fill="#EDCADC" stroke="#202832" stroke-width="2.5" />
      <text x="276.5" y="340.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">Select a new cue</text>
      <text x="276.5" y="369.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">set_cue(index)</text>
      <text x="276.5" y="398.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">Build excerpt · clear cache</text>
    </g>
    <g>
      <rect x="571" y="300" width="310" height="123" rx="12" fill="#EDCADC" stroke="#202832" stroke-width="2.5" />
      <text x="726.0" y="340.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">Scroll and highlight</text>
      <text x="726.0" y="369.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">window(step, elapsed)</text>
      <text x="726.0" y="398.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">Paste the updated window</text>
    </g>
    <g>
      <rect x="1025" y="300" width="306" height="123" rx="12" fill="#EDCADC" stroke="#202832" stroke-width="2.5" />
      <text x="1178.0" y="340.5" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="690" text-anchor="middle" fill="#202832">Hold the view</text>
      <text x="1178.0" y="369.5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="450" text-anchor="middle" fill="#455362">Reuse the page on a key match</text>
      <text x="1178.0" y="398.5" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="450" text-anchor="middle" fill="#455362">Await the next frame number</text>
    </g>
    <circle cx="65" cy="360" r="10" fill="#202832" />
    <text x="142" y="636" font-family="DejaVu Sans Mono, monospace" font-size="23" font-weight="650" text-anchor="start" fill="#202832">(step, min(12, elapsed))</text>
    <text x="142" y="673" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#455362">Twelve frames span 0.4 seconds. The encoder still receives bytes for every frame while the panel is held.</text>
  </g>
  <g id="labels">
    <rect x="449.5" y="331" width="107" height="24" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="503" y="347" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#455362">First view</text>
    <rect x="900.5" y="330" width="105" height="24" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="953" y="346" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#455362">Same key</text>
    <rect x="742.5" y="447" width="411" height="25" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="948" y="464" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#455362">Advance to the next line in the same cue</text>
    <rect x="794.0" y="205" width="212" height="25" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="900" y="222" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#455362">The next cue begins</text>
    <rect x="398.5" y="512" width="301" height="23" rx="4" fill="#FBFAF6" stroke="none" stroke-width="2.5" />
    <text x="549" y="527" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#455362">Key changes during interpolation</text>
  </g>
</svg>